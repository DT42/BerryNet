name: Docker Image CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - master
env:
  RC_NAME: dt42/berrynet
jobs:
  build:
    # Raspberry Pi 4 and 5 run 64-bit Arm.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # need to set dockerhub password in GitHub secrets
      #   - name: Login to docker hub
      #     uses: actions-hub/docker/login@master
      #     env:
      #       DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      #       DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      #   - name: Pull cache
      #     run: |
      #       docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      #       docker pull ${RC_NAME}:cache

      - name: Build image
        run: |
          docker build -t ${RC_NAME} -f docker/Dockerfile .
          docker tag ${RC_NAME} ${RC_NAME}:${GITHUB_SHA}
          docker tag ${RC_NAME} ${RC_NAME}:cache

      - name: Test image
        run: |
          docker run -d --name berrynet ${RC_NAME}
          sleep 20
          # There is no camera on the runner, so feed an image file.
          docker exec berrynet supervisorctl status litert-service dashboard
          docker cp berrynet/engine/grace_hopper.jpg berrynet:/tmp/test.jpg
          docker exec berrynet sh -c '
            mosquitto_sub -t berrynet/engine/litertdetector/result -C 1 -W 60 > /tmp/result.json &
            pid=$!
            sleep 2
            bn_camera --mode file --filepath /tmp/test.jpg
            wait $pid'
          docker exec berrynet python3 -c "import json; print(json.load(open('/tmp/result.json'))['annotations'])"
          docker exec berrynet curl -fsS -o /dev/null http://localhost:8080/

      - name: Show logs
        if: failure()
        run: |
          docker logs berrynet
          docker exec berrynet sh -c 'tail -n 20 /var/log/berrynet/*.log'

    # need to set dockerhub password in GitHub secrets
    #   - name: Push to docker registry
    #     uses: actions-hub/docker@master
    #     if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/prod') && success()
    #     with:
    #       args: push ${RC_NAME}:${GITHUB_SHA}
    #   - name: Push Cache to docker registry
    #     uses: actions-hub/docker@master
    #     if: always()
    #     with:
    #       args: push ${RC_NAME}:cache
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # LiteRT and ONNX Runtime have no wheels for Python 3.15 yet, so the
        # engine tests are skipped on 3.15.
        python-version: ["3.11", "3.13", "3.15"]
        include:
          # Raspberry Pi 4 and 5 run 64-bit Arm.
          - os: ubuntu-24.04-arm
            python-version: "3.13"

    env:
      BERRYNET_MODEL_DIR: ${{ github.workspace }}/models

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Download models
        if: matrix.python-version != '3.15'
        run: uv run python -m tests.data

      - name: Test with unittest
        run: |
          uv run python -m unittest -v
