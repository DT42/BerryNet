name: Docker Image CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - master
env:
  RC_NAME: dt42/berrynet
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      # need to set dockerhub password in GitHub secrets
      #   - name: Login to docker hub
      #     uses: actions-hub/docker/login@master
      #     env:
      #       DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      #       DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      #   - name: Pull cache
      #     run: |
      #       docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      #       docker pull ${RC_NAME}:cache

      - name: Build image
        if: always()
        run: |
          docker build --cache-from ${RC_NAME}:cache -t ${RC_NAME} -f docker/Dockerfile .
          docker tag ${RC_NAME} ${RC_NAME}:${GITHUB_SHA}
          docker tag ${RC_NAME} ${RC_NAME}:cache

    # need to set dockerhub password in GitHub secrets
    #   - name: Push to docker registry
    #     uses: actions-hub/docker@master
    #     if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/prod') && success()
    #     with:
    #       args: push ${RC_NAME}:${GITHUB_SHA}
    #   - name: Push Cache to docker registry
    #     uses: actions-hub/docker@master
    #     if: always()
    #     with:
    #       args: push ${RC_NAME}:cache
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # LiteRT and ONNX Runtime have no wheels for Python 3.15 yet, so the
        # engine tests are skipped on 3.15.
        python-version: ["3.11", "3.13", "3.15"]
        include:
          # Raspberry Pi 4 and 5 run 64-bit Arm.
          - os: ubuntu-24.04-arm
            python-version: "3.13"

    env:
      BERRYNET_MODEL_DIR: ${{ github.workspace }}/models

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Download models
        if: matrix.python-version != '3.15'
        run: uv run python -m tests.data

      - name: Test with unittest
        run: |
          uv run python -m unittest -v
