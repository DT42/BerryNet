
[program:litert-service]
command=bn_litert --service detector --model_package ssd-mobilenet-v1-coco-litert --num_threads 4 --draw --debug
stdout_logfile=/var/log/berrynet/litert-service-stdout.log
stdout_logfile_maxbytes=1048576
stderr_logfile=/var/log/berrynet/litert-service-stderr.log
stderr_logfile_maxbytes=1048576
priority=10

[program:camera]
command=bn_camera --fps 6
stdout_logfile=/var/log/berrynet/camera-stdout.log
stdout_logfile_maxbytes=1048576
stderr_logfile=/var/log/berrynet/camera-stderr.log
stderr_logfile_maxbytes=1048576
priority=30
