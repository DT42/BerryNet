[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "berrynet"
version = "3.10.2"
description = "Deep learning gateway on Raspberry Pi."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{ name = "DT42 Inc.", email = "berrynet@dt42.io" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = [
    "logzero",
    "numpy",
    "paho-mqtt",
    "PyOpenGL",
]

# Inference engines:     uv sync --extra litert --extra onnx
#                        pip install berrynet[litert,onnx]
# Wheel-version OpenCV:  uv sync --extra opencv / pip install berrynet[opencv]
#
# LiteRT and ONNX Runtime do not publish wheels for Python 3.15 yet, so
# their extras install nothing there.
[project.optional-dependencies]
litert = ["ai-edge-litert; python_version < '3.15'"]
onnx = ["onnxruntime; python_version < '3.15'"]
opencv = ["opencv-python"]

[project.scripts]
bn_camera = "berrynet.client.camera:main"
bn_dashboard = "berrynet.client.fbdashboard:main"
bn_data_collector = "berrynet.client.data_collector:main"
bn_gmail = "berrynet.client.gmail:main"
bn_telegram = "berrynet.client.telegram_bot:main"
bn_litert = "berrynet.service.litert_service:main"
bn_model = "berrynet.dlmodelmgr:main"
bn_onnx = "berrynet.service.onnx_service:main"
bn_pipeline = "berrynet.bndyda.bnpipeline:main"

[project.urls]
Homepage = "https://github.com/DT42/BerryNet"

[dependency-groups]
dev = [
    "bandit",
    "black",
    "isort",
    "mypy",
    # berrynet.service and the tests import cv2.
    "opencv-python",
    "pip-audit",
    "pylint",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["berrynet", "berrynet.*"]

[tool.uv]
# Only resolve releases that have been public for a week (supply-chain cooldown).
exclude-newer = "7 days"
